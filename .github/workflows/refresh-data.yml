# Keeps the hosted database fresh (docs/DEPLOY.md):
#   every 15 minutes: official alerts and Seattle Fire 911 calls (pipeline/ingest_alerts.py)
#                     and the hazard outlook, if pipeline/outlook_worker.py exists
#   daily:            safe places (pipeline/import_safe_places.py --seattle-official)
# Needs the repository secret DATABASE_URL. Without it (forks, or before setup)
# every step after the check is skipped and the run succeeds.
# GitHub may start scheduled runs late, and pauses schedules in a repository
# with no activity for 60 days.
name: Refresh data

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "37 10 * * *"  # daily, 10:37 UTC (02:37 / 03:37 Seattle)
  workflow_dispatch:
    inputs:
      safe_places:
        description: Also re-import safe places
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check for the DATABASE_URL secret
        id: secret
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DATABASE_URL repository secret: nothing to refresh."
          fi

      - uses: actions/checkout@v7
        if: steps.secret.outputs.present == 'true'

      - uses: actions/setup-python@v7
        if: steps.secret.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        if: steps.secret.outputs.present == 'true'
        run: pip install -r pipeline/requirements.txt

      - name: Ingest alerts
        if: steps.secret.outputs.present == 'true'
        run: python pipeline/ingest_alerts.py

      - name: Hazard outlook
        if: steps.secret.outputs.present == 'true' && hashFiles('pipeline/outlook_worker.py') != ''
        run: python pipeline/outlook_worker.py --once

      - name: Safe places
        if: >-
          steps.secret.outputs.present == 'true' &&
          (github.event.schedule == '37 10 * * *' || inputs.safe_places)
        run: python pipeline/import_safe_places.py --seattle-official
