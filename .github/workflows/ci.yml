# API tests, web build and a smoke test of the Docker image.
# Runs without the 72 MB SPD download: the database gets the schema plus the
# committed ML risk output (ml/output), and tests that need the full data load
# are skipped (BEACON_TEST_DATA=schema, see apps/api/tests/conftest.py).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway database inside the CI job only; not a secret.
  DATABASE_URL: postgresql://beacon:beacon-ci@localhost:5432/beacon
  PGPASSWORD: beacon-ci

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: beacon
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements*.txt
            pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt

      - name: Apply the schema
        run: |
          for f in db/schema/*.sql; do
            echo "::group::$f"
            psql -h localhost -U beacon -d beacon -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done

      - name: Load the committed ML risk output
        run: python pipeline/import_risk.py

      - name: Run pytest
        working-directory: apps/api
        env:
          BEACON_TEST_DATA: schema
        run: python -m pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        working-directory: apps/web
        run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: beacon
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t beacon .

      - name: Apply the schema
        run: |
          for f in db/schema/*.sql; do
            psql -h localhost -U beacon -d beacon -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Smoke test
        run: |
          docker run -d --name beacon --network host -e PORT=8000 -e DATABASE_URL="$DATABASE_URL" beacon
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health && break
            sleep 1
          done
          echo
          curl -fsS http://localhost:8000/api/health | grep -q '"database":"ok"'
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8000/some/deep/link | grep -q '<div id="root">'
          asset=$(curl -fsS http://localhost:8000/ | grep -o '/assets/index-[^"]*\.js' | head -n 1)
          curl -fsS -o /dev/null "http://localhost:8000$asset"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/nope)" = 404
          docker image ls beacon --format 'image size: {{.Size}}'

      - name: Container log
        if: always()
        run: docker logs beacon || true
